<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VEYRA - Chapter 01</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="settings.css">
    <link rel="stylesheet" href="chapter1.css">
    <!--google fonts-->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Kings&family=Average+Sans&display=swap" rel="stylesheet">
    <!--settings-->
    <link rel="stylesheet" href="settings.css">
    <script src="settings.js" defer></script>
</head>

<!-- VEYRA GLOBAL CONTROLS -->
<div id="gameControls">

    <button id="soundToggle" class="game-control-btn">
        ♫ SOUND ON
    </button>

    <button id="settingsButton" class="game-control-btn">
        ⚙ SETTINGS
    </button>

</div>

<!-- SETTINGS POPUP -->
<div id="settingsOverlay">

    <div id="settingsPopup">

        <button id="closeSettings" class="settings-close">
            ×
        </button>

        <h2 class="settings-heading">Settings</h2>

        <!-- MUSIC -->
        <div class="settings-option">
            <label for="musicVolume">
                Music Volume
                <span id="musicVolumeValue" class="settings-value">70%</span>
            </label>

            <input
                type="range"
                id="musicVolume"
                min="0"
                max="100"
                value="70"
            >
        </div>

        <hr class="settings-divider">

        <!-- SOUND EFFECTS -->
        <div class="settings-option">
            <label for="sfxVolume">
                Sound Effects Volume
                <span id="sfxVolumeValue" class="settings-value">85%</span>
            </label>

            <input
                type="range"
                id="sfxVolume"
                min="0"
                max="100"
                value="85"
            >
        </div>

        <hr class="settings-divider">

        <!-- WEBSITE -->
        <a
            href="https://whoisciel67-alt.github.io/bluehour/"
            target="_blank"
            rel="noopener noreferrer"
            class="settings-website"
        >
            Visit Website ↗
        </a>

    </div>

</div>

<!--opening cutscene for chapter 1-->

<section id="openingCutscene" class="cutscene active">

    <video id="openingVideo" playsinline preload="auto">
        <source src="videos/platform-opening.mp4" type="video/mp4">
    </video>

    <div class="cutscene-overlay"></div>

    <div class="cutscene-caption">
        <p>VEYRA TRANSIT STATION</p>
        <h1>PLATFORM 04</h1>
        <span>Six years later.</span>
    </div>

    <button id="playCutscene" class="skip-button">
        PLAY INTRO →
    </button>

    <button id="skipCutscene" class="skip-button">
        SKIP INTRO →
    </button>

</section>


<!--playable-->
<main id="platformScene" class="platform-scene">
    <div class="platform-darkness"></div>

    <!--location-->
    <div class="location-label">
        <span>VEYRA TRANSIT STATION</span>
        <p>PLATFORM 04 · 05:42 AM</p>
    </div>

    <!--Objective-->
    <div class="objective">
        <span>OBJECTIVE</span>
        <p>Follow the drifting lights.</p>
    </div>

    <!--petal trail-->
    <div class="petal-trail" aria-hidden="true">
        <span>✦</span>
        <span>✧</span>
        <span>✦</span>
        <span>✧</span>
        <span>✦</span>
    </div>

    <!--ticket gate-->
    <button id="ticketGate" class="ticket-gate" aria-label="Inspect the ticket gate">
        <span class="gate-glow"></span>
        <span class="gate-label">LUMA ACCESS</span>
        <span class="gate-prompt">[ E ] INSPECT</span>
    </button>

    <!--player-->
    <div id="player" class="player">
        <div class="player-light"></div>
        <div class="player-silhouette"></div>
    </div>

    <!--interacion hint-->
    <div id="movementHunt" class="movement-hint">
        <span>← →</span>
        MOVE
        <span>W-A-S-D</span>
    </div>

    <!-- DIALOGUE -->
    <div id="dialogueBox" class="dialogue-box">
        <p class="dialogue-speaker">UNKNOWN</p>
        <p id="dialogueText"></p>
        <button id="dialogueContinue">CONTINUE →</button>
    </div>



</main>>



</html>
