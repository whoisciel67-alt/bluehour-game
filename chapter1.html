<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VEYRA - Chapters</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="chapter-select.css">
    <script src="chapter-select.js" defer></script>
    <!--google fonts-->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Kings&family=Average+Sans&display=swap" rel="stylesheet">
    <!--settings-->
    <link rel="stylesheet" href="settings.css">
    <script src="settings.js" defer></script>
</head>

<!-- VEYRA GLOBAL CONTROLS -->
<div id="gameControls">

    <button id="soundToggle" class="game-control-btn">
        ♫ SOUND ON
    </button>

    <button id="settingsButton" class="game-control-btn">
        ⚙ SETTINGS
    </button>

</div>

<!-- SETTINGS POPUP -->
<div id="settingsOverlay">

    <div id="settingsPopup">

        <button id="closeSettings" class="settings-close">
            ×
        </button>

        <h2 class="settings-heading">Settings</h2>

        <!-- MUSIC -->
        <div class="settings-option">
            <label for="musicVolume">
                Music Volume
                <span id="musicVolumeValue" class="settings-value">70%</span>
            </label>

            <input
                type="range"
                id="musicVolume"
                min="0"
                max="100"
                value="70"
            >
        </div>

        <hr class="settings-divider">

        <!-- SOUND EFFECTS -->
        <div class="settings-option">
            <label for="sfxVolume">
                Sound Effects Volume
                <span id="sfxVolumeValue" class="settings-value">85%</span>
            </label>

            <input
                type="range"
                id="sfxVolume"
                min="0"
                max="100"
                value="85"
            >
        </div>

        <hr class="settings-divider">

        <!-- WEBSITE -->
        <a
            href="https://whoisciel67-alt.github.io/bluehour/"
            target="_blank"
            rel="noopener noreferrer"
            class="settings-website"
        >
            Visit Website ↗
        </a>

    </div>

</div>

<body>


    
</body>



</html>
