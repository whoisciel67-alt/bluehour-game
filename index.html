<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>afterimage: BLUEHOUR</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
    <!--google fonts-->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Kings&family=Average+Sans&display=swap" rel="stylesheet">
    <!--settings-->
    <link rel="stylesheet" href="settings.css">
    <script src="settings.js" defer></script>
</head>

<!-- VEYRA GLOBAL CONTROLS -->
<div id="gameControls">

    <button id="soundToggle" class="game-control-btn">
        ♫ SOUND ON
    </button>

    <button id="settingsButton" class="game-control-btn">
        ⚙ SETTINGS
    </button>

</div>

<!-- SETTINGS POPUP -->
<div id="settingsOverlay">

    <div id="settingsPopup">

        <button id="closeSettings" class="settings-close">
            ×
        </button>

        <h2 class="settings-heading">Settings</h2>

        <!-- MUSIC -->
        <div class="settings-option">
            <label for="musicVolume">
                Music Volume
                <span id="musicVolumeValue" class="settings-value">70%</span>
            </label>

            <input
                type="range"
                id="musicVolume"
                min="0"
                max="100"
                value="70"
            >
        </div>

        <hr class="settings-divider">

        <!-- SOUND EFFECTS -->
        <div class="settings-option">
            <label for="sfxVolume">
                Sound Effects Volume
                <span id="sfxVolumeValue" class="settings-value">85%</span>
            </label>

            <input
                type="range"
                id="sfxVolume"
                min="0"
                max="100"
                value="85"
            >
        </div>

        <hr class="settings-divider">

        <!-- WEBSITE -->
        <a
            href="https://whoisciel67-alt.github.io/bluehour/"
            target="_blank"
            rel="noopener noreferrer"
            class="settings-website"
        >
            Visit Website ↗
        </a>

    </div>

</div>

<audio id="menuMusic" src="audio/menu-theme.mp3" loop preload="auto"></audio>

<body>
    <!-- LOADING SCREEN -->
    <div class="loading-screen">

        <div class="loading-content">

            <p class="subtitle">LUMA MEMORY ARCHIVE</p>

            <h1>VEYRA</h1>

            <p class="loading-subtitle">
                Where forgotten memories remain...
            </p>

            <!-- PROGRESS BAR -->
            <div class="loading-bar">
                <div id="progress"></div>
            </div>

            <p id="loadingText">
                SYNCHRONIZING MEMORIES...
            </p>

            <p id="percentage">0%</p>

        </div>

        <!-- FLOATING PETALS -->
        <div class="petals">
            <span>｡ ˚⋆ . </span>
            <span>. ꕤ</span>
            <span>｡ ˚⋆ . </span>
            <span>. ꕤ</span>
            <span>｡ ˚⋆ . </span>
            <span>. ꕤ</span>
        </div>

    </div>

    <!-- MAIN MENU -->
    <div id="mainMenu">
        <p id="soundHint">CLICK ANYWHERE TO ENABLE SOUND</p>
        <h1>VEYRA</h1>

        <p>THE MEMORIES WE LEFT BEHIND</p>

        <div class="menu-options">
            <button class="menu-button" data-page="new.html">NEW JOURNEY</button>
            <button class="continue" data-page="continue.html">CONTINUE</button>
            <button class="memory-archive" data-page="archive.html">MEMORY ARCHIVE</button>
            <button class="settings" data-page="settings.html">SETTINGS</button>
            <button class="credits" data-page="credits.html">CREDITS</button>

        </div>

    </div>

</body>

</html>
